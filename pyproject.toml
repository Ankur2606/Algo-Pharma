[project]
name = "algo-pharma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "apify-client>=2.5.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.136.1",
    "firecrawl-py>=4.24.0",
    "google-genai>=1.74.0",
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "mcp>=1.0.0",
    "numpy>=2.4.4",
    "openai>=2.34.0",
    "openmed[hf]>=1.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "redis>=6.4.0",
    "sarvamai>=0.1.28",
    "scipy>=1.17.1",
    "spacy>=3.8.14",
    "sqlalchemy>=2.0.49",
    "torch>=2.10.0",
    "transformers>=5.8.0",
    "uvicorn[standard]>=0.46.0",
    "vadersentiment>=3.3.2",
    "en-core-web-sm",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

# ── CPU-only PyTorch ─────────────────────────────────────────────────────────
# This prevents uv from pulling the 2 GB CUDA wheel on machines without a GPU.
# Remove this section if you want GPU support.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
en-core-web-sm = [
    { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

